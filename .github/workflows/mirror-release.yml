
name: Mirror Releases to Codeberg

on:
  release:
    types:
      - published
      - edited
      - deleted
      - unpublished

  schedule:
    - cron: "47 3 * * *"

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codeberg-release-mirror-${{ github.repository }}
  cancel-in-progress: false

jobs:
  mirror:
    name: Release Mirror
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --disable-pip-version-check requests

      - name: Synchronize releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CODEBERG_TOKEN: ${{ secrets.CODEBERG_TOKEN }}

          GITHUB_REPOSITORY: ${{ github.repository }}

          CODEBERG_OWNER: TYHH10
          CODEBERG_REPO: HD2Mimnt
          CODEBERG_URL: https://codeberg.org

        run: |
          python scripts/mirror_releases.py

      - name: Summary
        if: always()
        run: |
          echo "## Codeberg Release Mirror" >> "$GITHUB_STEP_SUMMARY"
          echo "Source: GitHub" >> "$GITHUB_STEP_SUMMARY"
          echo "Target: Codeberg" >> "$GITHUB_STEP_SUMMARY"
