name: Release

# 推送 V主.次.补[-阶段] 形式的标签（如 V0.1.0-alpha、V1.0.0）时自动构建并创建 GitHub Release。
# 同时接受小写 v 前缀，兼容已有脚本；版本号推导会去掉 v/V 前缀。
# 发布流程说明见 docs/RELEASE_PROCESS.md。
on:
  push:
    tags:
      - 'V*.*.*'
      - 'V*.*.*-*'
      - 'v*.*.*'
      - 'v*.*.*-*'

permissions:
  contents: write

jobs:
  release:
    name: build-and-release
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      # 测试（单元/UI/性能/稳定性）在开发阶段本地执行，发布流水线不运行测试；
      # dotnet publish 自带还原与依赖构建
      - name: Compute version
        shell: pwsh
        run: Add-Content -Path $env:GITHUB_ENV -Value "VERSION=$($env:GITHUB_REF_NAME -replace '^[vV]', '')"

      # 与 Release.pubxml 一致：win-x64、框架依赖、非单文件。
      # 四个入口（UI/Cli/PluginHost/Worker）的 exe、入口 dll、deps/runtimeconfig 由项目引用输出到根目录，
      # 其余托管程序集由 UI csproj 的 MoveManagedAssembliesToLib 收进发布目录的 lib/。
      - name: Publish app
        shell: pwsh
        run: >
          dotnet publish src/HD2Mimnt.UI/HD2Mimnt.UI.csproj
          -c Release -r win-x64
          --self-contained false
          -p:Version=$env:VERSION

      # 布局回归防护：四个入口文件必须齐全；根目录只允许入口 dll 与 deps.json 记录的原生库，
      # 托管依赖必须已进 lib/，原生库不能被误收进 lib/（DllImport 只在应用目录查找）。
      - name: Verify publish layout
        shell: pwsh
        run: |
          $publishDir = 'src/HD2Mimnt.UI/bin/Release/net10.0/win-x64/publish'
          $entries = 'HD2Mimnt.UI', 'HD2Mimnt.Cli', 'HD2Mimnt.PluginHost', 'HD2Mimnt.Worker'
          foreach ($name in $entries) {
            foreach ($ext in '.exe', '.dll', '.deps.json', '.runtimeconfig.json') {
              if (-not (Test-Path (Join-Path $publishDir "$name$ext"))) {
                throw "发布目录缺少入口文件：$name$ext"
              }
            }
          }

          $libDir = Join-Path $publishDir 'lib'
          $libDlls = @(Get-ChildItem -Path $libDir -Filter *.dll -File -ErrorAction SilentlyContinue | ForEach-Object Name)
          foreach ($required in 'HD2Mimnt.Core.dll', 'HD2Mimnt.Application.dll', 'Avalonia.Base.dll') {
            if ($libDlls -notcontains $required) { throw "lib/ 下缺少托管程序集：$required" }
          }

          $deps = Get-Content -Raw (Join-Path $publishDir 'HD2Mimnt.UI.deps.json') | ConvertFrom-Json
          $nativeNames = foreach ($target in $deps.targets.PSObject.Properties.Value) {
            foreach ($library in $target.PSObject.Properties.Value) {
              if ($library.native) {
                $library.native.PSObject.Properties.Name | ForEach-Object { [System.IO.Path]::GetFileName($_) }
              }
            }
          }

          $entryDlls = $entries | ForEach-Object { "$_.dll" }
          $rootDlls = @(Get-ChildItem -Path $publishDir -Filter *.dll -File | ForEach-Object Name)
          $unexpected = @($rootDlls | Where-Object { $entryDlls -notcontains $_ -and $nativeNames -notcontains $_ })
          if ($unexpected.Count -gt 0) { throw "发布根目录出现未收拢的 dll：$($unexpected -join ', ')" }
          $misfiledNative = @($libDlls | Where-Object { $nativeNames -contains $_ })
          if ($misfiledNative.Count -gt 0) { throw "原生库被误收进 lib/：$($misfiledNative -join ', ')" }

      # 主包不含 .pdb；调试符号单独打包，便于事后排查本应用与子进程崩溃
      - name: Package release and symbols
        shell: pwsh
        run: |
          $publishDir = 'src/HD2Mimnt.UI/bin/Release/net10.0/win-x64/publish'
          $symbolsDir = 'dist/symbols'
          New-Item -ItemType Directory -Force $symbolsDir | Out-Null
          # pdb 随托管程序集收在 lib/ 内，需要递归收集
          Get-ChildItem -Path $publishDir -Filter *.pdb -File -Recurse | Move-Item -Destination $symbolsDir
          Compress-Archive -Path "$publishDir/*" -DestinationPath "dist/HD2Mimnt-$env:VERSION-win-x64.zip"
          Compress-Archive -Path "$symbolsDir/*" -DestinationPath "dist/HD2Mimnt-$env:VERSION-win-x64-symbols.zip"

      # 发布说明取自标签注解正文：第一行可以是版本号标题（会被去掉），其后为更新内容。
      # 标签正文为空（例如老的轻量标签或只写了一行版本号）时保留自动生成。
      - name: Collect release notes from tag
        shell: bash
        run: |
          set -euo pipefail
          tag="$GITHUB_REF_NAME"
          if [ -z "$(git tag -l "$tag")" ]; then
            git fetch --depth=1 origin "+refs/tags/$tag:refs/tags/$tag"
          fi
          notes="$(git tag -l --format='%(contents)' "$tag" | tr -d '\r')"
          first_line="$(printf '%s\n' "$notes" | head -n 1)"
          if printf '%s' "$first_line" | grep -Eqx '(v|V)?[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.]+)*'; then
            notes="$(printf '%s\n' "$notes" | tail -n +2)"
          fi
          printf '%s\n' "$notes" | sed -e '/./,$!d' > dist/release-notes.md
          if [ -s dist/release-notes.md ]; then
            echo "HAS_TAG_NOTES=true" >> "$GITHUB_ENV"
          else
            echo "HAS_TAG_NOTES=false" >> "$GITHUB_ENV"
          fi

      - name: Create GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          notes_args=(--generate-notes)
          if [ "$HAS_TAG_NOTES" = "true" ]; then
            notes_args=(--notes-file dist/release-notes.md)
          fi
          gh release create "$GITHUB_REF_NAME" --title "Release $GITHUB_REF_NAME" "${notes_args[@]}" dist/*.zip
