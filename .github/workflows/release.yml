name: Release

# 推送 V主.次.补[-阶段] 形式的标签（如 V0.1.0-alpha、V1.0.0）时自动构建并创建 GitHub Release。
# 发布流程说明见 docs/RELEASE_PROCESS.md。
on:
  push:
    tags:
      - 'V*.*.*'
      - 'V*.*.*-*'

permissions:
  contents: write

jobs:
  release:
    name: build-and-release
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      # 测试（单元/UI/性能/稳定性）在开发阶段本地执行，发布流水线不运行测试；
      # dotnet publish 自带还原与依赖构建
      - name: Compute version
        shell: pwsh
        run: Add-Content -Path $env:GITHUB_ENV -Value "VERSION=$($env:GITHUB_REF_NAME -replace '^V', '')"

      # 与 Release.pubxml 一致：win-x64、框架依赖、单文件。
      # 子进程 exe（PluginHost/Worker）由 UI csproj 的 PublishChildProcessHosts 目标补齐。
      - name: Publish app
        shell: pwsh
        run: >
          dotnet publish src/HD2Mimnt.UI/HD2Mimnt.UI.csproj
          -c Release -r win-x64
          --self-contained false
          -p:PublishSingleFile=true
          -p:Version=$env:VERSION

      # 主包不含 .pdb；调试符号单独打包，配合 minidump-stackwalk 排查崩溃转储
      - name: Package release and symbols
        shell: pwsh
        run: |
          $publishDir = 'src/HD2Mimnt.UI/bin/Release/net10.0/win-x64/publish'
          $symbolsDir = 'dist/symbols'
          New-Item -ItemType Directory -Force $symbolsDir | Out-Null
          Get-ChildItem -Path $publishDir -Filter *.pdb -File | Move-Item -Destination $symbolsDir
          Compress-Archive -Path "$publishDir/*" -DestinationPath "dist/HD2Mimnt-$env:VERSION-win-x64.zip"
          Compress-Archive -Path "$symbolsDir/*" -DestinationPath "dist/HD2Mimnt-$env:VERSION-win-x64-symbols.zip"

      - name: Create GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --title "Release $GITHUB_REF_NAME" --generate-notes dist/*.zip
