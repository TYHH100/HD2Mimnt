name: Source Model Reader tests

on:
  push:
    paths:
      - "tools/SourceModelReader/**"
      - ".github/workflows/source-model-reader-tests.yml"
  pull_request:
    paths:
      - "tools/SourceModelReader/**"
      - ".github/workflows/source-model-reader-tests.yml"

permissions:
  contents: read

jobs:
  python-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run Source Model Reader test suite
        working-directory: tools/SourceModelReader
        run: python -m unittest discover -s tests -v
